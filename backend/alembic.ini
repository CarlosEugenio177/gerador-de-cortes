# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to prepend to the slug value
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded with relative paths
# prepend_sys_path = .

# version location specification; this defaults
# to migrations/versions.  When using multiple version
# directories, paths must be separated by ';' or ','
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version path separator; as above, this defaults to the character used by version_locations.
# valid values include "os" (value of os.pathsep), "list" (multi-line list), or a literal separator character
# version_path_separator = :

# set to 'true' to search for newer versions in the version
# directories, rather than just the leaf node
# check_current_head = false

# database URL - overridden in env.py dynamically
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@db:5432/clipforge

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
