version: '3.8'

services:
  api-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playsquad_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - CLIPS_DIR=/app/uploads/clips
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playsquad_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-backend

volumes:
  uploads_data:
